interface:
  display_name: "Siege Master Problem"
  short_description: "Synthesize siege salvos against a master problem"
  default_prompt: "Use $siege-master-problem to work in the master problem's dedicated .worktrees branch. Map the full tech tree, adjudicate all parallel research conversations as one salvo before synthesis, and attack every claim independently. Keep the master absolute: retain only mathematics that cuts a named obstruction, unify or cull the rest, verify, commit and push each ratchet, then generate one next Pro prompt or an orthogonal MIRV portfolio across all promising routes. Report both the newest joint result and the net master frontier."
